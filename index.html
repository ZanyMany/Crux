<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crux Strength Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a coach's logbook — direct, encouraging, no fluff.
   IDEA: a climber's training board and topo card: chalk ground, granite bands, rope-red accents.
   PICTURE: today's session is the hero; Progress opens with a route topo where each hold is a pull-up.
   COLOUR and TYPE: chalk white + granite ink, rope red accent, slate support; Barlow Condensed + Inter.
   LAYOUT: one calm column up to 760px, sticky tabs, big tap targets, stacked on phones. */
:root{color-scheme:light dark;
--bg:light-dark(#f1f2f0,#121518);--card:light-dark(#fff,#1b2024);--ink:light-dark(#15191c,#eef0f1);
--mute:light-dark(#5b636a,#9aa3ab);--line:light-dark(#dcdfe1,#2b3237);--rope:light-dark(#d93a2f,#ff6b5d);
--slate:light-dark(#2f4b6e,#91b4de);--ok:light-dark(#1d7a4c,#5fd39a);--okbg:light-dark(#e3f4ea,#173326);
--granite:light-dark(#1f2428,#0b0d0f);--sec:light-dark(#f4b0a9,#7a3a35);--fig:light-dark(#aeb6bd,#5d6770);--fig2:light-dark(#959ea6,#737d86);--bar:light-dark(#3d454c,#c3cbd2);--nobg:light-dark(#fbe3e0,#3d2220);--soft:light-dark(#f6f7f6,#22282d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:700;line-height:1.05;margin:0}
.top{background:var(--granite);color:#f3f4f4;padding:20px max(5vw,16px) 18px}
.top .in{max-width:760px;margin:auto;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between}
.top h1{font-size:40px;letter-spacing:.5px}.top h1 b{color:#ff6b5d}
.top p{margin:2px 0 0;color:#aeb6bd;font-size:14px}
.kpis{display:flex;gap:18px}.kpi .num{font-size:30px;color:#fff}.kpi span{display:block;font-size:12px;color:#aeb6bd}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .in{max-width:760px;margin:auto;display:flex;padding:0 max(2vw,8px)}
nav a{flex:1;text-align:center;padding:13px 4px;color:var(--mute);text-decoration:none;font-weight:600;font-size:15px;border-bottom:3px solid transparent;min-height:48px}
nav a.on{color:var(--ink);border-color:var(--rope)}
main{max-width:760px;margin:auto;padding:18px max(4vw,14px) 110px}
.status{font-size:13px;color:var(--mute);margin:0 0 12px}
h2{font-size:30px;margin:6px 0 4px}.sub{color:var(--mute);margin:0 0 16px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.exh{display:flex;justify-content:space-between;gap:12px;align-items:start}
.exh h3{font-size:22px}.note{margin:3px 0 0;color:var(--mute);font-size:14px}
.tgt{white-space:nowrap;text-align:right}.tgt .num{font-size:26px;color:var(--rope)}.tgt small{display:block;color:var(--mute);font-size:12px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin:12px 0 10px}
.set{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
input,select,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:10px;min-height:46px;width:100%}
.set input{text-align:center;font-weight:600;font-size:18px}
.set input.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,nav a:focus-visible{outline:3px solid var(--slate);outline-offset:2px}
button{font:600 15px Inter,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--rope);border-color:var(--rope);color:#fff;width:100%;font-size:17px;min-height:54px}
button.ghost{background:none}button.small{min-height:38px;padding:0 12px;font-size:14px}
button.warn{color:var(--rope)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.viewer{margin:6px 0 10px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}.vhead{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;flex-wrap:wrap}.vcap{flex:1 1 180px;margin:0;font-size:14.5px;font-weight:600;line-height:1.35;display:flex;gap:8px;align-items:baseline}.vstep{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--rope);color:#fff;font:700 13px 'Barlow Condensed',sans-serif;transform:translateY(-1px)}.vseg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}.vseg button{border:0;background:none;min-height:32px;padding:0 11px;font-size:13px;color:var(--mute);border-radius:8px}.vseg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0003}.vstage{background:var(--soft);border-block:1px solid var(--line)}.vgrip{background:var(--card);border-bottom:1px solid var(--line)}.gguide{display:block;width:100%;height:auto}.stage{display:block;width:100%;height:auto}.vctl{display:flex;align-items:center;gap:12px;padding:12px 12px 4px}.vplay{flex:none;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;border:0;background:var(--rope);color:#fff;display:grid;place-items:center}.vscrub{flex:1}.vscrub input{width:100%;min-height:0;height:24px;padding:0;border:0;background:none;accent-color:var(--rope)}.vends{display:flex;justify-content:space-between}.vends button{border:0;background:none;min-height:28px;padding:0 2px;font-size:12.5px;color:var(--mute)}.vends button.on{color:var(--ink);font-weight:700}.vchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;padding:8px 12px 4px}.vchip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 10px;border-radius:18px;font-size:13.5px;font-weight:600;color:var(--mute);background:var(--soft);border:1px solid var(--line)}.vchip.on{color:var(--ink);background:color-mix(in srgb,var(--rope) 14%,var(--card));border-color:color-mix(in srgb,var(--rope) 55%,var(--line))}.vchip.on svg{color:var(--rope)}.vnotes{padding:4px 14px 12px}.vnote{margin:6px 0 0;font-size:13.5px;line-height:1.45;color:var(--ink)}.vnote.bad{color:var(--rope)}.vnote.bad span{color:var(--mute)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}.steps{margin:6px 0 0;padding-left:22px}.steps li{margin:6px 0;font-size:15px;line-height:1.45}.how h4.dh:first-of-type{margin-top:10px}.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin:10px 0 8px}.seg button{flex:1;border:0;background:none;min-height:42px;color:var(--mute)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}.banner{background:var(--okbg);color:var(--ok);border-radius:12px;padding:12px 14px;margin:0 0 12px;font-weight:600}
.msgs{margin:8px 0 0;padding-left:20px}.msgs li{margin:4px 0}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 12px}
@media(min-width:640px){.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat .num{font-size:34px}.stat .lab{font-size:13px;color:var(--mute)}.up{color:var(--ok);font-size:13px;font-weight:600}.down{color:var(--rope);font-size:13px;font-weight:600}
.fig{position:relative;min-height:180px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.wk{display:grid;grid-template-columns:62px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin:5px 0}
.bar{height:16px;background:var(--soft);border-radius:8px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--slate);border-radius:8px}.bar i.met{background:var(--ok)}
.route{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:16px;align-items:center}
.route .fig{min-height:240px}
details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:40px}
details summary::-webkit-details-marker{display:none}
.hist td{padding:4px 8px 4px 0;font-size:14px;vertical-align:top}.hist td:last-child{text-align:right;white-space:nowrap}
.pe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.pe label,.pl{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.timer{position:fixed;right:max(4vw,14px);bottom:max(16px,env(safe-area-inset-bottom));z-index:9;background:var(--granite);color:#fff;border:0;border-radius:30px;min-height:46px;padding:0 16px;font:700 18px "Barlow Condensed",sans-serif;box-shadow:0 6px 20px #0004}
.timer.run{background:var(--rope)}
.how summary{min-height:36px;color:var(--slate);font-weight:600;font-size:14px}.dg{display:block;width:100%;max-width:460px;height:auto;margin:8px 0 6px}.mus{margin-top:0}.dh{font:700 18px 'Barlow Condensed',sans-serif;margin:16px 0 0;letter-spacing:.3px}.dg{border-radius:14px}.mleg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.mchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:20px;background:var(--soft);border:1px solid var(--line)}.mchip i{width:10px;height:10px;border-radius:50%;display:inline-block}.how p{margin:4px 0 0;font-size:15px}.empty{color:var(--mute);text-align:center;padding:24px 8px}
.upd{position:fixed;left:50%;transform:translateX(-50%);top:max(12px,env(safe-area-inset-top));z-index:20;display:flex;align-items:center;gap:12px;max-width:calc(100% - 28px);padding:8px 8px 8px 16px;border-radius:14px;background:var(--granite);color:#fff;font:600 15px Inter,sans-serif;box-shadow:0 8px 24px #0005}
.upd button{min-height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--rope);color:#fff;font:700 15px Inter,sans-serif}
.upd button.x{background:none;color:#aeb6bd;padding:0 10px}
@media(max-width:600px){.top h1{font-size:34px}.pe{grid-template-columns:repeat(2,minmax(0,1fr))}.route{grid-template-columns:110px minmax(0,1fr)}}

</style>
<style>
/* ===== Climbing-wall theme: plywood board with T-nut bolt grid, panels screwed on, holds as buttons ===== */
:root{--board:light-dark(#d6d9da,#1a1e21);--hole:light-dark(#aab0b4,#08090a);--ring:light-dark(#eef0f0,#2b3136);--card:light-dark(#f5f6f5,#23282d);--soft:light-dark(#eceeed,#1e2327);
 --screw:light-dark(#c4c9cd,#5a636b);--screwE:light-dark(#8b9298,#2c3237);--line:light-dark(#d3d7d9,#343b41);--bg:var(--board);
 --h-red:#e0533d;--h-yel:#f0b429;--h-grn:#34a065;--h-blu:#3b7dd8;--h-pur:#8b5cd6;--h-org:#ee7a2a;--h-pnk:#e2649c}
body{background-color:var(--board);background-image:radial-gradient(circle,var(--hole) 0 2px,var(--ring) 2.4px 3.8px,transparent 4.2px),radial-gradient(circle,var(--hole) 0 2px,var(--ring) 2.4px 3.8px,transparent 4.2px),repeating-linear-gradient(90deg,transparent 0 359px,rgba(0,0,0,.07) 359px 361px);background-size:44px 44px,44px 44px,auto;background-position:0 0,22px 22px,0 0;background-attachment:fixed}

.top{background-color:var(--granite);background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='130' height='64' viewBox='0 0 130 64'><path d='M8 30c6-12 26-12 30 0s-6 20-16 20-20-8-14-20z' fill='%23e0533d'/><circle cx='22' cy='36' r='2.6' fill='%23222'/><path d='M48 14c8-8 26-6 28 6s-10 16-20 14-16-12-8-20z' fill='%23f0b429'/><circle cx='61' cy='22' r='2.6' fill='%23222'/><path d='M86 36c6-10 24-10 28 0s-6 18-16 18-18-8-12-18z' fill='%2334a065'/><circle cx='99' cy='42' r='2.6' fill='%23222'/><path d='M60 48c4-6 14-6 16 0s-4 10-9 10-10-5-7-10z' fill='%233b7dd8'/><circle cx='67' cy='52' r='2' fill='%23222'/><g fill='%23ffffff' opacity='.22'><circle cx='42' cy='52' r='2'/><circle cx='118' cy='14' r='2'/><circle cx='88' cy='8' r='2'/></g></svg>");background-repeat:no-repeat;background-position:right max(5vw,16px) bottom 14px;background-size:130px 64px}
.card{position:relative;background-color:var(--card);border-radius:16px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 0 rgba(0,0,0,.08),0 8px 18px rgba(0,0,0,.07);
 background-image:radial-gradient(circle at 11px 11px,var(--screw) 0 2.6px,var(--screwE) 3px 3.6px,transparent 4px),radial-gradient(circle at calc(100% - 11px) 11px,var(--screw) 0 2.6px,var(--screwE) 3px 3.6px,transparent 4px),radial-gradient(circle at 11px calc(100% - 11px),var(--screw) 0 2.6px,var(--screwE) 3px 3.6px,transparent 4px),radial-gradient(circle at calc(100% - 11px) calc(100% - 11px),var(--screw) 0 2.6px,var(--screwE) 3px 3.6px,transparent 4px);background-repeat:no-repeat}

/* hold: an irregular resin blob with sand texture, shading and a bolt */
.hold,button.pri,.vplay,.vchip.on,.set input.ok,.timer,.seg button.on{position:relative;border:0!important;color:#fff!important;
 background-image:radial-gradient(rgba(255,255,255,.2) .7px,transparent 1.1px),radial-gradient(rgba(0,0,0,.13) .7px,transparent 1.1px)!important;background-size:5px 5px,6px 6px!important;background-position:0 0,2px 3px!important;
 box-shadow:inset -3px -4px 0 rgba(0,0,0,.18),inset 2px 3px 0 rgba(255,255,255,.22),0 2px 0 rgba(0,0,0,.28),0 5px 10px rgba(0,0,0,.14)!important;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.hold::after,button.pri::after,.vchip.on::after,.timer::after,.set input.ok+i::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;top:calc(50% - 4.5px);background:radial-gradient(circle at 42% 38%,#f4f5f6 0 1.3px,#9aa1a7 1.8px 3.2px,#353a3f 3.5px);box-shadow:0 0 0 1px rgba(0,0,0,.3)}

.kpi .num{text-shadow:0 1px 0 rgba(0,0,0,.4)}

</div></header>
<nav><div class="in">

   <div class="tgt"><div class="num">${ns(e)} × ${e.reps}</div><small>${e.unit==='sec'?'seconds':'reps'} per set</small></div></div>
   ${howHTML(e)}
   <div class="sets">${Array.from({length:ns(e)},(_,i)=>`<label class="set">Set ${i+1}<input type="number" inputmode="numeric" min="0" data-i="${i}" placeholder="${e.reps}" value="${v[i]??''}" class="${v[i]!=null&&v[i]!==''&&+v[i]>=e.reps?'ok':''}"></label>`).join('')}</div>
   <div class="row"><button class="small ghost hit">All sets hit ✓</button><button class="small ghost clr">Clear</button></div></div>`}).join('');
  h+=`<div class="card"><label class="pl">Notes (how it felt, sore spots…)<textarea id="note" rows="2">${esc(d.note)}</textarea></label></div>
   <button class="pri" id="finish">Finish &amp; log session</button><p class="status" id="ferr"></p>`;
  return h;
}
function bindToday(v){
  v.querySelectorAll('.card[data-id]').forEach(c=>{
    const e=S.plan.find(x=>x.id===c.dataset.id);
    c.addEventListener('input',ev=>{const i=ev.target.dataset.i;if(i==null)return;
      (S.draft.vals[e.id]=S.draft.vals[e.id]||[])[i]=ev.target.value;
      ev.target.classList.toggle('ok',ev.target.value!==''&&+ev.target.value>=e.reps);persist()});
    c.querySelector('.hit').onclick=()=>{S.draft.vals[e.id]=Array(ns(e)).fill(String(e.reps));persist();c.querySelectorAll('input').forEach(i=>{i.value=e.reps;i.classList.add('ok')})};
    c.querySelector('.clr').onclick=()=>{delete S.draft.vals[e.id];persist();c.querySelectorAll('input').forEach(i=>{i.value='';i.classList.remove('ok')})};
  });
  v.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.draft.mode=b.dataset.m;justDone=null;persist();render()});
  v.querySelector('#note').oninput=ev=>{S.draft.note=ev.target.value;persist()};
  v.querySelector('#finish').onclick=finish;
}
function finish(){
  const items=[],msgs=[];
  const q=isQ();
  list().forEach(e=>{const n=ns(e),raw=(S.draft.vals[e.id]||[]).slice(0,n);
    if(!raw.some(x=>x!==''&&x!=null))return;
    const sets=Array.from({length:n},(_,i)=>raw[i]===''||raw[i]==null?0:+raw[i]);
    items.push({id:e.id,name:e.name,unit:e.unit,target:e.reps,sets,pull:!!e.pull});
    if(!q&&sets.every(x=>x>=e.reps)){
      if(e.step>0&&e.reps<e.cap){const n=Math.min(e.cap,e.reps+e.step);msgs.push(`${e.name}: next time ${e.sets} × ${n}${e.unit==='sec'?' sec':''}`);e.reps=n}
      else if(e.step>0)msgs.push(`${e.name}: maxed out at ${e.reps}. Time for a harder version (edit it in Plan).`);
    }});
  if(!items.length){document.getElementById('ferr').textContent='Log at least one set first.';return}
  S.logs.push({id:uid(),date:TODAY(),items,note:S.draft.note||'',mode:q?'quick':'full'});
  if(q&&!msgs.length)msgs.push('Quick session done. Consistency is what builds strength.');
  S.draft={date:TODAY(),vals:{},note:'',mode:S.draft.mode};justDone=msgs;persist();render();scrollTo({top:0});
}

/* ---------- PROGRESS ---------- */
const METRICS=[{k:'pullups',l:'Max pull-ups',u:''},{k:'pushups',l:'Push-ups in 1 min',u:''},{k:'hang',l:'Max dead hang',u:'s'},{k:'weight',l:'Body weight',u:' lb'}];
function vProgress(){
  const pu=latest('pullups').at(-1),g=S.settings.pullGoal;
  let h=`<h2>Progress</h2><p class="sub">Re-test your maxes every 2–3 weeks on a fresh day to see real strength gains.</p>
  <div class="card route"><div class="fig"><svg id="topo" role="img" aria-label="Route to pull-up goal"></svg></div>
   <div><div class="num" style="font-size:44px">${pu?pu.pullups:0} <span style="color:var(--mute);font-size:26px">/ ${g}</span></div>
   <p class="note" style="font-size:15px">pull-ups on the route to your goal. Each spot is one rep: the holds are reps you've sent, the bolts are still to go.</p></div></div>
  <div class="grid4">${METRICS.map(m=>{const t=latest(m.k),a=t[0],b=t.at(-1);const dif=b&&a&&t.length>1?+b[m.k]-+a[m.k]:null;
    return `<div class="card stat"><div class="num">${b?esc(b[m.k])+m.u:'–'}</div><div class="lab">${m.l}</div>${dif?`<div class="${(m.k==='weight'?0:dif>0)?'up':'down'}">${dif>0?'+':''}${Math.round(dif*10)/10}${m.u} since ${nice(a.date)}</div>`:''}</div>`}).join('')}</div>
  <div class="card"><h3 style="font-size:22px;margin-bottom:10px">Log a max test</h3>
   <div class="form"><label>Date<input type="date" id="tdate" value="${TODAY()}"></label>
   ${METRICS.map(m=>`<label>${m.l}${m.u?' ('+m.u.trim()+')':''}<input type="number" inputmode="decimal" min="0" id="t-${m.k}"></label>`).join('')}</div>
   <div class="row" style="margin-top:10px"><button id="tsave">Save test</button><span class="status" id="terr" style="margin:0"></span></div></div>`;
  h+=METRICS.filter(m=>latest(m.k).length).map(m=>`<div class="card"><h3 style="font-size:20px">${m.l}</h3><div class="fig"><svg data-m="${m.k}"></svg></div></div>`).join('');
  h+=`<div class="card"><h3 style="font-size:20px">Pulling volume per session</h3><p class="note">Total reps of negatives + pull-ups.</p>${S.logs.length?'<div class="fig"><svg data-m="vol"></svg></div>':'<p class="empty">Finish your first session to start this chart.</p>'}</div>
  <div class="card"><h3 style="font-size:20px;margin-bottom:6px">Consistency, last 8 weeks</h3><p class="note" style="margin-bottom:8px">Goal: ${S.settings.weekly} sessions a week</p>
  ${weeks(8).map(w=>`<div class="wk"><span>${nice(w.k)}</span><div class="bar"><i class="${w.c>=S.settings.weekly?'met':''}" style="width:${Math.min(100,w.c/S.settings.weekly*100)}%"></i></div><b style="color:var(--ink)">${w.c}</b></div>`).join('')}</div>`;
  return h;
}
function topo(svg){const W=svg.clientWidth,H=svg.clientHeight;if(!W)return;const g=Math.max(1,S.settings.pullGoal),pu=+(latest('pullups').at(-1)?.pullups||0);
  let s=`<rect x="0" y="0" width="${W}" height="${H}" rx="12" fill="var(--soft)"/>`,pts=[];
  for(let i=0;i<g;i++){const y=H-24-(i+.5)*(H-48)/g,x=W/2+(i%2?1:-1)*W*.22*Math.sin(i*1.7+1);pts.push([x,y])}
  s+=`<polyline points="${[[W/2,H-8],...pts].map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="5 6"/>`;
  const HC=['var(--h-red)','var(--h-blu)','var(--h-yel)','var(--h-grn)','var(--h-pur)','var(--h-org)','var(--h-pnk)'];
  pts.forEach(([x,y],i)=>{const on=i<pu;
    if(on){const a=i*47%360,b=[11+(i%3),7+(i%2)*1.5];s+=`<g transform="rotate(${a%40-20} ${x} ${y})"><path d="M${x-b[0]},${y+1} C${x-b[0]},${y-b[1]-2} ${x+b[0]*.6},${y-b[1]-3} ${x+b[0]},${y-2} C${x+b[0]+2},${y+b[1]} ${x-b[0]*.4},${y+b[1]+2} ${x-b[0]},${y+1}Z" fill="${HC[i%HC.length]}" stroke="#0003" stroke-width="1.5"/></g><circle cx="${x}" cy="${y}" r="2.6" fill="#33383d" stroke="#aab0b5" stroke-width="1.2"/>`}
    else s+=`<circle cx="${x}" cy="${y}" r="5.4" fill="var(--ring)"/><circle cx="${x}" cy="${y}" r="2.8" fill="var(--hole)"/>`});
  const c=pu>0?pts[Math.min(pu,g)-1]:[W/2,H-14];s+=`<circle cx="${c[0]+16}" cy="${c[1]-4}" r="7" fill="var(--slate)"/><text x="${W/2}" y="16" text-anchor="middle" font-size="12" fill="var(--mute)">Top · ${g}</text>`;
  svg.innerHTML=s}
function chart(svg,pts,unit,zero){const W=svg.clientWidth,H=svg.clientHeight;if(!W||!pts.length)return;
  const P={l:36,r:14,t:16,b:26},ts=pts.map(p=>pd(p.x).getTime()),t0=Math.min(...ts),t1=Math.max(...ts);
  const ys=pts.map(p=>p.y);let lo=zero?0:Math.min(...ys)*.95,hi=Math.max(...ys)*1.15||1;if(hi<=lo)hi=lo+1;
  const X=(t,i)=>t1===t0?P.l+(W-P.l-P.r)*(pts.length===1?.5:i/(pts.length-1)):P.l+(t-t0)/(t1-t0)*(W-P.l-P.r);
  const Y=y=>H-P.b-(y-lo)/(hi-lo)*(H-P.t-P.b);
  let s='';for(let k=0;k<=2;k++){const v=lo+(hi-lo)*k/2,y=Y(v);s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/>${W>360||k!==1?`<text x="${P.l-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mute)">${Math.round(v)}</text>`:''}`}
  const xy=pts.map((p,i)=>[X(ts[i],i),Y(p.y)]);
  s+=`<polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--rope)" stroke-width="2.5" stroke-linejoin="round"/>`;
  s+=xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--card)" stroke="var(--rope)" stroke-width="2.5"/>`).join('');
  const L=xy.at(-1);s+=`<text x="${Math.min(L[0],W-P.r-4)}" y="${L[1]-10}" text-anchor="end" font-size="13" font-weight="600" fill="var(--ink)">${pts.at(-1).y}${unit}</text>`;
  s+=`<text x="${P.l}" y="${H-6}" font-size="11" fill="var(--mute)">${nice(pts[0].x)}</text>${pts.length>1?`<text x="${W-P.r}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--mute)">${nice(pts.at(-1).x)}</text>`:''}`;
  svg.innerHTML=s}
function bindProgress(v){
  const draw=()=>{const t=v.querySelector('#topo');if(t)topo(t);
    v.querySelectorAll('svg[data-m]').forEach(s=>{const k=s.dataset.m;
      if(k==='vol'){const by={};S.logs.forEach(l=>{by[l.date]=(by[l.date]||0)+l.items.filter(i=>i.pull).reduce((a,i)=>a+i.sets.reduce((x,y)=>x+y,0),0)});
        chart(s,Object.keys(by).sort().map(x=>({x,y:by[x]})),'',true)}
      else{const m=METRICS.find(x=>x.k===k);const by={};latest(k).forEach(t=>by[t.date]=+t[k]);chart(s,Object.keys(by).sort().map(x=>({x,y:by[x]})),m.u,k!=='weight')}})};
  const ro=new ResizeObserver(draw);v.querySelectorAll('.fig').forEach(f=>ro.observe(f));obs.push(ro);
  v.querySelector('#tsave').onclick=()=>{const t={id:uid(),date:v.querySelector('#tdate').value||TODAY()};let any=0;
    METRICS.forEach(m=>{const x=v.querySelector('#t-'+m.k).value;t[m.k]=x===''?null:+x;if(x!=='')any=1});
    if(!any){v.querySelector('#terr').textContent='Enter at least one number.';return}
    S.tests.push(t);persist();render()};
}

/* ---------- HISTORY ---------- */
function vHistory(){
  const L=[...S.logs].sort((a,b)=>a.date<b.date?1:-1),T=[...S.tests].sort((a,b)=>a.date<b.date?1:-1);
  let h=`<h2>History</h2><p class="sub">${S.logs.length} session${S.logs.length===1?'':'s'} logged. Tap one to see every set.</p>`;
  h+=L.length?L.map(l=>{const tot=l.items.reduce((a,i)=>a+i.sets.filter(x=>x>=i.target).length,0),all=l.items.reduce((a,i)=>a+i.sets.length,0);
   return `<details class="card"><summary><span><b>${pd(l.date).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</b><br><span class="note">${l.mode==='quick'?'Quick · ':''}${l.items.length} exercises · ${tot}/${all} sets on target</span></span><span class="note">▾</span></summary>
   <table class="hist">${l.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.sets.join(' · ')}${i.unit==='sec'?' s':''} <span class="note">(goal ${i.target})</span></td></tr>`).join('')}</table>
   ${l.note?`<p class="note">“${esc(l.note)}”</p>`:''}<div class="row" style="margin-top:8px"><button class="small ghost warn del" data-k="logs" data-id="${l.id}">Delete session</button></div></details>`}).join(''):'<p class="empty card">No sessions yet. Your first one is waiting on the Today tab.</p>';
  h+=`<h3 style="font-size:22px;margin:18px 0 8px">Max tests</h3>`+(T.length?T.map(t=>`<div class="card row" style="justify-content:space-between"><span><b>${nice(t.date)}</b> <span class="note">${METRICS.filter(m=>t[m.k]!=null).map(m=>`${m.l}: ${t[m.k]}${m.u}`).join(' · ')}</span></span><button class="small ghost warn del" data-k="tests" data-id="${t.id}">Delete</button></div>`).join(''):'<p class="empty">No tests yet.</p>');
  h+=`<div class="row" style="margin-top:16px"><button id="copy">Copy backup of all data</button><span class="status" id="cmsg" style="margin:0"></span></div>`;
  return h;
}
function bindHistory(v){
  v.querySelectorAll('.del').forEach(b=>b.onclick=ev=>{ev.preventDefault();if(b.dataset.arm){S[b.dataset.k]=S[b.dataset.k].filter(x=>x.id!==b.dataset.id);persist();render()}else{b.dataset.arm=1;b.textContent='Tap again to delete'}});
  v.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));v.querySelector('#cmsg').textContent='Copied ✓'}catch(e){v.querySelector('#cmsg').textContent='Copy not allowed here.'}};
}

/* ---------- PLAN ---------- */
function vPlan(){
  let h=`<h2>Your plan</h2><p class="sub">Customize anything. "+ per level" is how much the target rises when you hit every set; "Max" is where it stops so you can switch to a harder version. "Quick sets" sets how many sets an exercise gets in Quick mode.</p>
  <div class="card"><div class="form"><label>Sessions per week goal<input type="number" min="1" max="7" data-s="weekly" value="${S.settings.weekly}"></label>
  <label>Pull-up goal<input type="number" min="1" max="50" data-s="pullGoal" value="${S.settings.pullGoal}"></label></div></div>`;
  h+=S.plan.map((e,i)=>`<div class="card" data-id="${e.id}"><label class="pl">Exercise<input data-f="name" value="${esc(e.name)}"></label>
   <div class="pe"><label>Sets<input type="number" min="1" max="10" data-f="sets" value="${e.sets}"></label>
   <label>Target<input type="number" min="1" data-f="reps" value="${e.reps}"></label>
   <label>+ per level<input type="number" min="0" data-f="step" value="${e.step}"></label>
   <label>Max<input type="number" min="1" data-f="cap" value="${e.cap}"></label></div>
   <div class="pe"><label>Quick sets (0 = skip)<input type="number" min="0" max="10" data-f="qs" value="${qs(e)}"></label></div>
   <div class="pe" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr)"><label>Unit<select data-f="unit"><option value="reps"${e.unit==='reps'?' selected':''}>reps</option><option value="sec"${e.unit==='sec'?' selected':''}>seconds</option></select></label>
   <label>Tip<input data-f="note" value="${esc(e.note)}"></label></div>
   <div class="row" style="margin-top:10px"><label class="row" style="font-size:14px;color:var(--mute)"><input type="checkbox" data-f="pull" ${e.pull?'checked':''} style="width:20px;min-height:20px"> counts as pulling volume</label></div>
   <div class="row" style="margin-top:8px"><button class="small ghost mv" data-d="-1" ${i?'':'disabled'}>↑ Up</button><button class="small ghost mv" data-d="1" ${i<S.plan.length-1?'':'disabled'}>↓ Down</button><button class="small ghost warn rm">Remove</button></div></div>`).join('');
  h+=`<div class="row"><button id="add">+ Add exercise</button><button class="ghost warn" id="reset">Reset to starter plan</button></div>`;
  return h;
}
function bindPlan(v){
  v.querySelectorAll('[data-s]').forEach(i=>i.onchange=()=>{const n=Math.max(1,+i.value||1);S.settings[i.dataset.s]=n;persist();kpis()});
  v.querySelectorAll('.card[data-id]').forEach(c=>{const e=S.plan.find(x=>x.id===c.dataset.id);
    c.querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>{const f=i.dataset.f;
      e[f]=i.type==='checkbox'?i.checked:i.type==='number'?Math.max(0,+i.value||0):i.value;
      if(f==='sets'||f==='reps'||f==='cap')e[f]=Math.max(1,e[f]);persist()});
    c.querySelectorAll('.mv').forEach(b=>b.onclick=()=>{const i=S.plan.indexOf(e),j=i+ +b.dataset.d;[S.plan[i],S.plan[j]]=[S.plan[j],S.plan[i]];persist();render()});
    const rm=c.querySelector('.rm');rm.onclick=()=>{if(rm.dataset.arm){S.plan=S.plan.filter(x=>x!==e);persist();render()}else{rm.dataset.arm=1;rm.textContent='Tap again to remove'}};
  });
  v.querySelector('#add').onclick=()=>{S.plan.push({id:uid(),name:'New exercise',sets:3,reps:10,unit:'reps',step:1,cap:20,note:''});persist();render();scrollTo({top:document.body.scrollHeight})};
  const r=v.querySelector('#reset');r.onclick=()=>{if(r.dataset.arm){S.plan=plan0();persist();render()}else{r.dataset.arm=1;r.textContent='Tap again: reset plan (logs are kept)'}};
}

/* ---------- router ---------- */
const VIEWS={today:[vToday,bindToday],progress:[vProgress,bindProgress],history:[vHistory,bindHistory],plan:[vPlan,bindPlan]};
let cur='today';
function render(){
  obs.forEach(o=>o.disconnect());obs=[];
  const t=(location.hash||'').slice(1);cur=VIEWS[t]?t:'today';
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===cur));
  const v=document.getElementById('view');v.innerHTML=VIEWS[cur][0]();VIEWS[cur][1](v);kpis();
}
addEventListener('hashchange',()=>{justDone=null;render();scrollTo({top:0})});

/* ---------- rest timer ---------- */
const tb=document.getElementById('timer');let tInt=null,ac=null;
const fmt=s=>Math.floor(s/60)+':'+pad(s%60);
tb.onclick=()=>{
  if(tInt){clearInterval(tInt);tInt=null;tb.classList.remove('run');tb.textContent='Rest 2:00';return}
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  let left=120;tb.classList.add('run');tb.textContent=fmt(left);
  tInt=setInterval(()=>{left--;tb.textContent=fmt(left);if(left<=0){clearInterval(tInt);tInt=null;tb.textContent='Go! 💪';
    try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.6);o.start();o.stop(ac.currentTime+.6)}catch(e){}
    try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}
    setTimeout(()=>{if(!tInt){tb.classList.remove('run');tb.textContent='Rest 2:00'}},3000)}},1000);
};
bindViewers();
boot();
}
</script>
<script>
/* ---------- auto-update ----------
   GitHub Pages always serves the latest main, but an iPhone home-screen app can keep showing a cached copy.
   On launch (and when you come back after 30+ min) fetch a fresh copy of this page, which also refreshes the
   browser cache, and compare it with the cached copy that is running. If it changed: reload straight away when
   you haven't touched anything yet, otherwise offer a Reload bar. Saved data is untouched (same address). */
{
  let touched=false,lastCheck=0;const t0=Date.now();
  ['pointerdown','keydown','input'].forEach(e=>addEventListener(e,()=>{touched=true},{capture:true,once:true}));
  const bar=()=>{if(document.querySelector('.upd'))return;const d=document.createElement('div');d.className='upd';d.setAttribute('role','status');
    d.innerHTML='<span>New version ready</span><button type="button">Reload</button><button type="button" class="x" aria-label="Later">Later</button>';
    d.querySelector('button').onclick=()=>location.reload();d.querySelector('.x').onclick=()=>d.remove();document.body.appendChild(d)};
  async function checkUpdate(){
    if(!/^https?:$/.test(location.protocol)||!window.fetch)return;
    lastCheck=Date.now();
    try{const url=location.origin+location.pathname;
      const running=await (await fetch(url,{cache:'force-cache'})).text();
      const r=await fetch(url,{cache:'reload'});if(!r.ok)return;const fresh=await r.text();
      if(!fresh||fresh===running)return;
      if(!touched&&Date.now()-t0<8000)location.reload();else bar();
    }catch(e){/* offline or blocked: keep running the current copy */}
  }
  addEventListener('load',()=>setTimeout(checkUpdate,600));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastCheck>30*60e3)checkUpdate()});
}
</script>
</body>
